<html lang="zh">
<head>

<title>风里的小羊 · Flow v3</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2f5a3a;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,"PingFang SC",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 82px);transform:translateX(-50%);color:#fffbea;font-size:13px;letter-spacing:.1em;padding:7px 14px;border-radius:20px;background:rgba(30,50,30,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
#hint.off{opacity:0}
#bar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:999px;background:rgba(28,44,30,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.18)}
#bar button{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,250,235,.14);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s,background .2s}
#bar button:active{transform:scale(.88)}
#bar svg{width:19px;height:19px;fill:none;stroke:#fff8e6;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sound svg path:first-child{fill:#fff8e6}
#sound .x{display:none}#sound.muted .x{display:inline}#sound.muted .w{display:none}

input[type=range]{-webkit-appearance:none;appearance:none;width:min(42vw,180px);height:4px;border-radius:2px;background:linear-gradient(90deg,#f7b6c8 var(--p,45%),rgba(255,248,230,.35) var(--p,45%));outline:none}

<body>
<canvas id="ground"></canvas>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<div id="hint">拖着小羊滑 · 点草地它会跑过去</div>
<div id="bar">
  <button id="gust" aria-label="来一阵风" title="来一阵风">
    <svg viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg>
  </button>
  <input id="wind" type="range" min="0" max="1" step="0.01" value="0.45" aria-label="风力">
  <button id="sound" aria-label="声音" title="声音">
    <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg>
  </button>
</div>
<script>
// Wind field: global strength + travelling gust bands + pointer impulses.
(function () {
  // small value-noise
  const P = new Uint8Array(512);
  for (let i = 0; i < 256; i++) P[i] = i;
  let s = 7;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [P[i], P[j]] = [P[j], P[i]]; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const fade = t => t * t * (3 - 2 * t);
  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const a = P[(P[xi & 255] + yi) & 511], b = P[(P[(xi + 1) & 255] + yi) & 511];
    const c = P[(P[xi & 255] + yi + 1) & 511], d = P[(P[(xi + 1) & 255] + yi + 1) & 511];
    const u = fade(xf), v = fade(yf);
    return ((a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v) / 255; // 0..1
  }

  const Wind = {
    noise2,
    strength: 0.45,      // slider 0..1
    gustBoost: 0, gustHold: 0,        // button-triggered global gust 0..1, decays
    angle: 0.35,         // base direction (rad), slowly wanders
    t: 0,
    impulses: [],        // {x,y,dx,dy,r,life}
    // grass parting around the moving lamb: the lamb itself + a short wake of points that spring back
    lambPart: null, trail: [],   // {x,y,R,k}
    part(x, y) {
      let px = 0, py = 0, pg = 0;
      const add = (cx, cy, R, k) => {
        if (k > -0.01 && k < 0.01) return;
        const dx = x - cx, dy = y - cy, lim = R * 2.3;
        if (dx > lim || dx < -lim || dy > lim || dy < -lim) return;
        const d = Math.sqrt(dx * dx + dy * dy) || 1, q = (d - R * 0.75) / (R * 0.6), f = Math.exp(-q * q) * k;
        px += dx / d * f; py += dy / d * f; pg += Math.abs(f);
      };
      const L = this.lambPart; if (L) add(L.x, L.y, L.R, L.k);
      for (const p of this.trail) add(p.x, p.y, p.R, p.k);
      return [px, py, pg];
    },
    update(dt) {
      this.t += dt;
      this.angle = 0.35 + (noise2(this.t * 0.05, 3.1) - 0.5) * 0.9;
      // gust button: ease in over ~0.4s, hold briefly, then decay (no instant jump)
      if (this.gustHold > 0) { this.gustHold -= dt; this.gustBoost += (1 - this.gustBoost) * Math.min(1, dt * 3.5); }
      else this.gustBoost = Math.max(0, this.gustBoost - dt * 0.3);
      for (const im of this.impulses) { im.life -= dt; im.r += dt * 260; im.x += im.dx * dt * 160; im.y += im.dy * dt * 160; }
      this.impulses = this.impulses.filter(i => i.life > 0);
    },
    poke(x, y, dx, dy, power) {
      const l = Math.hypot(dx, dy) || 1;
      if (this.impulses.length > 24) this.impulses.shift();
      this.impulses.push({ x, y, dx: dx / l, dy: dy / l, r: 30, life: 1.4, p: power });
    },
    // returns [vx, vy, gustAmount]; units: 0..~1.6
    at(x, y) {
      const t = this.t, ca = Math.cos(this.angle), sa = Math.sin(this.angle);
      const along = x * ca + y * sa, across = -x * sa + y * ca;
      const S = this.strength + this.gustBoost * 0.8;
      // gust bands travel along the wind direction; speed grows with strength
      const speed = 90 + S * 260;
      const band = noise2((along - t * speed) * 0.0042, across * 0.0025 + t * 0.05);
      const band2 = noise2((along - t * speed * 1.3) * 0.011, across * 0.008);
      let g = Math.max(0, band * 1.5 - 0.45) + band2 * 0.25;
      g = g * g;
      // slow resting swell: visible light bands that travel even at low wind
      const rest = noise2((along - t * (45 + S * 60)) * 0.0024, across * 0.0016 + 7.3);
      const rb = Math.max(0, rest * 1.8 - 0.85);
      const m = S * (0.25 + 1.25 * g) + 0.03 + rb * 0.12;
      let vx = ca * m, vy = sa * m;
      for (const im of this.impulses) {
        const d = Math.hypot(x - im.x, y - im.y), w = 70;
        const k = Math.exp(-((d - im.r) * (d - im.r)) / (w * w)) * im.life * im.p;
        if (k > 0.01) { vx += im.dx * k; vy += im.dy * k; g += k * 0.6; }
      }
      return [vx, vy, Math.min(1.5, g * (0.4 + S) + rb * 0.42)];
    }
  };
  window.Wind = Wind;
})();

</script>
<script>
// Procedural audio: wind (rumble + whistle) + leaf/grass rustle + synthesized "baa".
// The same graph builder drives the live AudioContext and an OfflineAudioContext render (for video export).
(function () {
  function noiseBuf(ctx, sec, pink) {
    const len = ctx.sampleRate * sec, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (!pink) { d[i] = w * 0.5; continue; }
        b0 = 0.997 * b0 + w * 0.029; b1 = 0.985 * b1 + w * 0.032; b2 = 0.95 * b2 + w * 0.048;
        d[i] = (b0 + b1 + b2 + w * 0.02) * 0.9;
      }
    }
    return buf;
  }
  function buildGraph(ctx, dest) {
    const N = { ctx };
    N.master = ctx.createGain(); N.master.connect(dest);
    N.bus = ctx.createGain(); N.bus.connect(N.master);   // wind/rustle bus, ducked under the bleat
    const src = ctx.createBufferSource(); src.buffer = noiseBuf(ctx, 4, true); src.loop = true;
    N.low = ctx.createBiquadFilter(); N.low.type = 'lowpass'; N.low.frequency.value = 400;
    N.band = ctx.createBiquadFilter(); N.band.type = 'bandpass'; N.band.frequency.value = 700; N.band.Q.value = 6;
    N.lowG = ctx.createGain(); N.bandG = ctx.createGain(); N.lowG.gain.value = 0; N.bandG.gain.value = 0;
    src.connect(N.low).connect(N.lowG).connect(N.bus);
    src.connect(N.band).connect(N.bandG).connect(N.bus);
    const rs = ctx.createBufferSource(); rs.buffer = noiseBuf(ctx, 3, false); rs.loop = true;
    N.hp = ctx.createBiquadFilter(); N.hp.type = 'highpass'; N.hp.frequency.value = 2500;
    N.pk = ctx.createBiquadFilter(); N.pk.type = 'peaking'; N.pk.frequency.value = 5000; N.pk.gain.value = 6;
    N.rustG = ctx.createGain(); N.rustG.gain.value = 0;
    rs.connect(N.hp).connect(N.pk).connect(N.rustG).connect(N.bus);
    N.stepBuf = noiseBuf(ctx, 0.2, false);
    src.start(0); rs.start(0);
    return N;
  }
  function setLevel(N, level, gust, t) {
    const L = Math.min(1.4, level);
    N.lowG.gain.setTargetAtTime(0.15 + L * 0.9, t, 0.25);
    N.low.frequency.setTargetAtTime(250 + L * 900, t, 0.3);
    N.bandG.gain.setTargetAtTime(L * L * 0.3, t, 0.3);
    N.band.frequency.setTargetAtTime(450 + L * 900, t, 0.4);
    const flick = 0.5 + Math.random() * 0.5;
    N.rustG.gain.setTargetAtTime(Math.min(0.25, (gust || 0) * 0.16 * flick + L * 0.02), t, 0.05);
  }
  // soft lamb bleat: sawtooth through formants with vibrato and a falling pitch
  function bleat(N, t) {
    const ctx = N.ctx, o = ctx.createOscillator(); o.type = 'sawtooth';
    const f0 = 470 + Math.random() * 80;
    o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f0 * 1.08, t + 0.12); o.frequency.exponentialRampToValueAtTime(f0 * 0.82, t + 0.75);
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 7.5; lg.gain.value = 14; lfo.connect(lg).connect(o.frequency);
    const env = ctx.createGain(); env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(0.8, t + 0.06); env.gain.setTargetAtTime(0, t + 0.5, 0.12);
    for (const [f, q, g] of [[900, 5, 1], [1700, 7, 0.6], [2700, 8, 0.25]]) {
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      const gg = ctx.createGain(); gg.gain.value = g; o.connect(bp).connect(gg).connect(env);
    }
    env.connect(N.master);
    N.bus.gain.cancelScheduledValues(t); N.bus.gain.setTargetAtTime(0.3, t, 0.04); N.bus.gain.setTargetAtTime(1, t + 0.75, 0.2);
    o.start(t); lfo.start(t); o.stop(t + 1.1); lfo.stop(t + 1.1);
  }

  // soft footstep rustle: a short band-passed noise tick (grass brushing the legs)
  function step(N, t, amt) {
    const ctx = N.ctx, b = ctx.createBufferSource(); b.buffer = N.stepBuf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200 + Math.random() * 1600; bp.Q.value = 0.9;
    const env = ctx.createGain(); env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(0.07 + 0.09 * Math.min(1, amt), t + 0.015); env.gain.setTargetAtTime(0, t + 0.03, 0.035);
    b.connect(bp).connect(env).connect(N.master);
    b.start(t, Math.random() * 0.05, 0.15);
  }
  const A = { ctx: null, on: true, N: null, log: null };
  A.start = function () {
    if (A.ctx) { A.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    A.ctx = new C(); A.N = buildGraph(A.ctx, A.ctx.destination); A.N.master.gain.value = A.on ? 1 : 0;
  };
  A.setOn = function (v) { A.on = v; if (A.N) A.N.master.gain.setTargetAtTime(v ? 1 : 0, A.ctx.currentTime, 0.15); };
  // simTime: scene clock in seconds; when A.log is an array, events are recorded for offline export
  A.update = function (level, gust, simTime) {
    if (A.log) A.log.push(['l', simTime, level, gust]);
    if (A.N) setLevel(A.N, level, gust, A.ctx.currentTime);
  };
  A.baa = function (simTime) {
    if (A.log) A.log.push(['b', simTime]);
    if (A.N) bleat(A.N, A.ctx.currentTime);
  };
  A.step = function (simTime, amt) {
    if (A.log) A.log.push(['s', simTime, amt]);
    if (A.N && A.on) step(A.N, A.ctx.currentTime, amt);
  };
  // Render a recorded log offline; returns a base64 16-bit stereo WAV.
  A.renderOffline = async function (log, duration, rate = 48000) {
    const ctx = new OfflineAudioContext(2, Math.ceil(duration * rate), rate);
    const N = buildGraph(ctx, ctx.destination); N.master.gain.value = 1;
    let last = -1;
    for (const e of log) {
      if (e[0] === 'b') bleat(N, e[1]);
      else if (e[0] === 's') step(N, e[1], e[2]);
      else if (e[1] - last >= 1 / 30 - 1e-6) { setLevel(N, e[2], e[3], e[1]); last = e[1]; }
    }
    const buf = await ctx.startRendering();
    const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
    let peak = 1e-6; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
    const k = Math.min(1, 0.89 / peak);
    const out = new DataView(new ArrayBuffer(44 + n * 4));
    const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
    out.setUint32(24, rate, true); out.setUint32(28, rate * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * 4, true);
    for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i] * k)) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i] * k)) * 32767, true); }
    const bytes = new Uint8Array(out.buffer); let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  window.WindAudio = A;
})();

</script>
<script>
// WebGL2 instanced grass: one quad per blade, bristle sprite atlas, wind from a CPU-sampled grid texture.
(function () {
  const VS = `#version 300 es
in vec2 aCorner; in vec2 iPos; in vec4 iP; in vec3 iQ;   // iP: len,width,rest,phase  iQ: layer,variant,curl
uniform vec2 uView; uniform float uTime, uQuality, uCell; uniform vec2 uGrid; uniform sampler2D uWind;
out vec2 vUv; out float vGust; flat out int vLayer;
float hash(float n){ return fract(sin(n) * 43758.5453); }
void main(){
  if (hash(float(gl_InstanceID) * 0.7311 + 0.17) > uQuality) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  vec3 w = texture(uWind, (iPos / uCell + 0.5) / uGrid).xyz;
  vec2 v = (w.xy * 2.0 - 1.0) * 2.0; float g = w.z * 1.5;
  float m = min(1.4, length(v)), k = min(1.0, m * 1.4);
  float fl = sin(uTime * 4.0 + iP.w) * (0.06 + m * 0.08);   // fixed frequency: no phase jumps when wind changes
  float wa = atan(v.y, v.x) + fl + iQ.z * 0.3;
  vec2 d = vec2(cos(iP.z), sin(iP.z)) * (1.0 - k) * 0.8 + vec2(cos(wa), sin(wa)) * k;
  float len = iP.x * min(1.25, 0.6 + length(d) * 0.5);   // capped stretch
  vec2 dir = normalize(d + 1e-5), nrm = vec2(-dir.y, dir.x);
  float u = aCorner.x;
  vec2 p = iPos + dir * u * len + nrm * (aCorner.y * iP.y + (iQ.z * 0.35 + 0.25 * k * sign(iQ.z + 0.001)) * len * u * (1.0 - u));
  gl_Position = vec4(p / uView * 2.0 - 1.0, 0.0, 1.0); gl_Position.y = -gl_Position.y;
  vUv = vec2(u, ((aCorner.y + 0.5) * 0.9 + 0.05 + iQ.y) / 3.0);
  vGust = g; vLayer = int(iQ.x + 0.5);
}`;
  const FS = `#version 300 es
precision mediump float;
in vec2 vUv; in float vGust; flat in int vLayer;
uniform sampler2D uAtlas; uniform vec3 uBase[5]; uniform vec3 uHi[5];
out vec4 o;
void main(){
  vec4 t = texture(uAtlas, vUv);
  vec3 c = mix(uBase[vLayer], uHi[vLayer], smoothstep(0.08, 1.1, vGust));
  c *= t.rgb / 0.84;
  o = vec4(c * t.a, t.a);
}`;
  const G = { ok: false };
  let wf = null, gl, prog, vao, inst, count = 0, windTex, atlasTex, U = {}, gw = 0, gh = 0, cell = 16, wbuf, view = [1, 1];

  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

  G.init = function (canvas, atlasCanvas, palette) {
    try {
      gl = canvas.getContext('webgl2', { premultipliedAlpha: true, antialias: false, alpha: true });
      if (!gl) return false;
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);
      for (const n of ['uView', 'uTime', 'uQuality', 'uCell', 'uGrid', 'uWind', 'uAtlas', 'uBase', 'uHi']) U[n] = gl.getUniformLocation(prog, n);
      gl.uniform3fv(U.uBase, palette.flatMap(l => hex(l[0])));
      gl.uniform3fv(U.uHi, palette.flatMap(l => hex(l[2])));
      vao = gl.createVertexArray(); gl.bindVertexArray(vao);
      const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -0.5, 1, -0.5, 0, 0.5, 1, 0.5]), gl.STATIC_DRAW);
      const aC = gl.getAttribLocation(prog, 'aCorner'); gl.enableVertexAttribArray(aC); gl.vertexAttribPointer(aC, 2, gl.FLOAT, false, 0, 0);
      inst = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, inst);
      const st = 9 * 4;
      for (const [n, sz, off] of [['iPos', 2, 0], ['iP', 4, 2], ['iQ', 3, 6]]) {
        const l = gl.getAttribLocation(prog, n); gl.enableVertexAttribArray(l);
        gl.vertexAttribPointer(l, sz, gl.FLOAT, false, st, off * 4); gl.vertexAttribDivisor(l, 1);
      }
      atlasTex = gl.createTexture(); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, atlasTex);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlasCanvas);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      windTex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, windTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.uniform1i(U.uWind, 0); gl.uniform1i(U.uAtlas, 1);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      G.ok = true; return true;
    } catch (e) { console.warn('WebGL grass disabled:', e.message); G.ok = false; return false; }
  };

  // blades: [{x,y,len,width,ra,ph,layer,v,curl}] already sorted back->front
  G.build = function (blades, w, h, dpr) {
    const c = gl.canvas; c.width = w * dpr; c.height = h * dpr; gl.viewport(0, 0, c.width, c.height);
    view = [w, h];
    const a = new Float32Array(blades.length * 9);

      for (let i = 0; i < a.length; i += 5) {
        g.moveTo(a[i] + Math.cos(a[i + 3]) * a[i + 2], a[i + 1] + Math.sin(a[i + 3]) * a[i + 2]);
        g.arc(a[i], a[i + 1], a[i + 2], a[i + 3], a[i + 3] + a[i + 4]);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
    // wisps on the outline, blown downwind
    g.strokeStyle = 'rgba(255,250,240,.8)'; g.lineWidth = Math.max(1.2, r * 0.035);
    g.beginPath();
    for (const w of S.wisps) {
      const [x, y] = P(w.u, w.v, s); const wob = Math.sin(L.fl + w.ph);
      const l = r * w.l * (0.25 + m * 0.55) * (0.6 + 0.4 * wob);
      g.moveTo(x, y); g.quadraticCurveTo(x + nx * l * 0.5 - ny * wob * 3, y + ny * l * 0.5 + nx * wob * 3, x + nx * l, y + ny * l);
    }
    g.stroke();

    // head
    const PH = (u, v, k) => P(u + hb, v, k);
    const [hx, hy] = PH(1.02, 0, s); const hr = r * 0.44 * s;
    L.hx = hx; L.hy = hy; L.hr = hr;
    L.ear += dt * (4 + m * 4);
    g.lineCap = 'round';
    for (const side of [-1, 1]) {
      let ea = face + side * (1.75 + Math.sin(L.ear + side * 1.3) * (0.15 + m * 0.6) + air * 0.5 - (hp >= 0.78 ? 0.25 : 0));
      { const dd = Math.atan2(Math.sin(wa - ea), Math.cos(wa - ea)); ea += dd * Math.min(0.55, m * 0.45); }   // ears stream downwind
      const ex = hx + Math.cos(ea) * hr * 0.55, ey = hy + Math.sin(ea) * hr * 0.55, ux = Math.cos(ea), uy = Math.sin(ea);
      // ear: a few parallel brush strokes, tan outside, pink inner stroke
      for (let k = 0; k < 4; k++) {
        const o = (k - 1.5) * hr * 0.09;
        g.strokeStyle = ['#b89a78', '#d5bb9b', '#e8d5ba', '#c9ad8c'][k]; g.lineWidth = hr * 0.17;
        g.beginPath(); g.moveTo(ex - uy * o, ey + ux * o); g.lineTo(ex + ux * hr * (0.95 - Math.abs(o) / hr) - uy * o, ey + uy * hr * (0.95 - Math.abs(o) / hr) + ux * o); g.stroke();
      }
      g.strokeStyle = '#eeb0b2'; g.lineWidth = hr * 0.11;
      g.beginPath(); g.moveTo(ex + ux * hr * 0.2, ey + uy * hr * 0.2); g.lineTo(ex + ux * hr * 0.75, ey + uy * hr * 0.75); g.stroke();
    }
    const hg = g.createRadialGradient(hx - hr * 0.3, hy - hr * 0.3, hr * 0.1, hx, hy, hr * 1.05);
    hg.addColorStop(0, '#f8eddc'); hg.addColorStop(0.8, '#e6d4b9'); hg.addColorStop(1, 'rgba(226,207,179,0)');
    g.fillStyle = hg; g.beginPath(); g.ellipse(hx, hy, hr * 1.08, hr * 0.94, face, 0, 6.283); g.fill();
    // head fur: short strokes combed from the crown toward the snout
    for (let i = 0; i < 26; i++) {
      const a = i * 2.39996, rr = Math.sqrt((i + 0.5) / 26) * 0.75;
      const [fx, fy] = PH(1.02 + Math.cos(a) * rr * 0.42, Math.sin(a) * rr * 0.36, s);
      const len = hr * 0.28, dir = face + Math.sin(a) * 0.5;
      g.strokeStyle = ['#e9dac3', '#f5ecdd', '#fffaf1', '#dccaae'][i % 4]; g.lineWidth = hr * 0.12;
      g.beginPath(); g.moveTo(fx, fy); g.quadraticCurveTo(fx + Math.cos(dir + 0.4) * len * 0.5, fy + Math.sin(dir + 0.4) * len * 0.5, fx + Math.cos(dir) * len, fy + Math.sin(dir) * len); g.stroke();
    }
    const [sx, sy] = PH(1.38, 0, s);
    g.fillStyle = '#f4e6d4'; g.beginPath(); g.ellipse(sx, sy, hr * 0.5, hr * 0.55, face, 0, 6.283); g.fill();
    g.strokeStyle = '#fbf3e8'; g.lineWidth = hr * 0.09;
    for (let i = 0; i < 5; i++) { const [ax, ay] = PH(1.3, (i - 2) * 0.07, s); g.beginPath(); g.moveTo(ax, ay); g.lineTo(ax + ca * hr * 0.35, ay + sa * hr * 0.35); g.stroke(); }
    const [qx, qy] = PH(1.56, 0, s);
    g.fillStyle = '#e39aa2'; g.beginPath(); g.ellipse(qx, qy, hr * 0.12, hr * 0.19, face, 0, 6.283); g.fill();
    for (const side of [-1, 1]) {
      const [bx, by] = PH(1.25, side * 0.35, s); g.fillStyle = 'rgba(244,160,170,.4)'; g.beginPath(); g.arc(bx, by, hr * 0.16, 0, 6.283); g.fill();
      const [ex, ey] = PH(1.17, side * 0.21, s);
      g.fillStyle = '#3a2a22'; g.beginPath(); g.ellipse(ex, ey, hr * 0.085, L.blink > 0 ? hr * 0.02 : hr * 0.11, face, 0, 6.283); g.fill();
    }
    // curly fringe on the crown
    g.strokeStyle = WOOL[3]; g.lineWidth = Math.max(1.2, r * 0.06); g.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = i * 2.4, rr = 0.1 + (i % 4) * 0.07, wob = Math.sin(L.fl + i);
      const [fx, fy] = PH(0.9 + Math.cos(a) * rr, Math.sin(a) * rr * 1.3, s);
      const cx = fx + nx * r * 0.05 * (1 + wob * 0.5), cy = fy + ny * r * 0.05 * (1 + wob * 0.5), cr = hr * 0.18, a0 = a + face;
      g.moveTo(cx + Math.cos(a0) * cr, cy + Math.sin(a0) * cr); g.arc(cx, cy, cr, a0, a0 + 3);
    }
    g.stroke();
    g.restore();
    return gu + m * 0.4;
  }

  function draw(g, dt, t) {
    g.clearRect(0, 0, S.w, S.h);
    const useGL = window.GrassGL && GrassGL.ok;
    if (useGL) GrassGL.draw(t, S.quality, dt);
    else drawGrass(g, t, 0, 2);
    drawFlowers(g, t);
    drawLanded(g, dt);
    moveLamb(dt, t);
    const lvl = drawLamb(g, dt, t);
    // Mask: front blades may only overlap a thin crescent at the lamb's lower edge, never its back/head.
    const Lm = S.lamb; g.save();
    for (const [cx, cy, rx, ry] of [[Lm.bx, Lm.by - Lm.r * 0.18, Lm.r * 1.2 * (Lm.drawS || 1), Lm.r * 0.95 * (Lm.drawS || 1)], [Lm.hx, Lm.hy - Lm.r * 0.1, Lm.hr * 1.9, Lm.hr * 1.9]]) {
      g.beginPath(); g.rect(-50, -50, S.w + 100, S.h + 100); g.ellipse(cx, cy, rx, ry, Lm.drawFace, 0, 6.283); g.clip('evenodd');
    }
    drawGrass(g, t, 3, 4, useGL); g.restore(); // GL path: only re-draw front blades around the lamb so it sits in the grass
    drawTree(g, t, dt);
    drawPetals(g, dt, t);
    return lvl;
  }

  const hitLamb = (x, y) => Math.hypot(x - S.lamb.x, y - S.lamb.y) < S.lamb.r * 1.5;
  function hop() { const L = S.lamb; L.hop = 1; L.shake = 0.6; }
  function grab(x, y) { const L = S.lamb; L.mode = 'drag'; L.gx = L.x - x; L.gy = L.y - y; L.tx = x; L.ty = y; }
  function dragTo(x, y) { const L = S.lamb; if (L.mode === 'drag') { L.tx = x; L.ty = y; } }
  function release() {
    const L = S.lamb; if (L.mode !== 'drag') return;
    const sp = Math.hypot(L.vx, L.vy), cap = L.r0 * 14;               // small glide on release
    if (sp > cap) { L.vx *= cap / sp; L.vy *= cap / sp; }
    L.mode = 'glide';
  }
  function walkTo(x, y) {
    const L = S.lamb; if (L.mode === 'drag') return;
    [L.tx, L.ty] = clampPt(x, y); L.mode = 'walk';
  }
  function tapLamb(x, y) {
    const L = S.lamb;
    if (Math.hypot(x - L.x, y - L.y) < L.r * 1.5) { L.hop = 1; L.shake = 0.6; return true; }
    L.faceT = Math.atan2(y - L.y, x - L.x); L.look = 2.5;
    return false;
  }

  window.Scene = { buildAtlas, GRASS, build, draw, tapLamb, hitLamb, hop, grab, dragTo, release, walkTo, state: S };
})();

</script>
<script>
// Boot, resize, loop, UI and pointer wiring.
(function () {
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  const slider = document.getElementById('wind'), gustBtn = document.getElementById('gust'), sndBtn = document.getElementById('sound'), hint = document.getElementById('hint');
  let dpr = 1;
  const glOk = GrassGL.init(document.getElementById('gl'), Scene.buildAtlas(), Scene.GRASS);
  window.__grassMode = glOk ? 'webgl2' : 'canvas2d';
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, glOk ? 2 : 1.5);
    const w = innerWidth, h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    Scene.build(w, h, dpr);
  }
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
  resize();

  const setP = () => slider.style.setProperty('--p', slider.value * 100 + '%');
  slider.addEventListener('input', () => { Wind.strength = +slider.value; setP(); }); setP();
  Wind.strength = +slider.value;

  function unlock() { WindAudio.start(); hint.classList.add('off'); }
  gustBtn.addEventListener('click', () => { unlock(); Wind.gustHold = 0.9; gustBtn.classList.add('on'); setTimeout(() => gustBtn.classList.remove('on'), 900); });
  sndBtn.addEventListener('click', () => { unlock(); WindAudio.setOn(!WindAudio.on); sndBtn.classList.toggle('muted', !WindAudio.on); });

  // pointer:
  //  - on the lamb: quick tap = hop + baa; press and move (>8px) = drag it across the grass (glides a little on release)
  //  - on the grass: tap = ring gust + the lamb trots over there; swipe = gust along the stroke + the lamb trots to where you let go
  let ptr = null;
  const pt = e => [e.clientX, e.clientY];
  cv.addEventListener('pointerdown', e => {
    if (ptr) return;                                   // ignore extra fingers
    unlock(); e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    const [x, y] = pt(e), onLamb = Scene.hitLamb(x, y);
    ptr = { id: e.pointerId, x0: x, y0: y, lx: x, ly: y, t0: performance.now(), onLamb, drag: false, moved: false };
    if (!onLamb) {
      Scene.tapLamb(x, y);                              // lamb glances toward the touch
      for (let i = 0; i < 6; i++) { const a = i / 6 * 6.283; Wind.poke(x, y, Math.cos(a), Math.sin(a), 0.5); }
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const [x, y] = pt(e);
    if (!ptr.moved && Math.hypot(x - ptr.x0, y - ptr.y0) > 8) {
      ptr.moved = true;
      if (ptr.onLamb) { ptr.drag = true; Scene.grab(ptr.x0, ptr.y0); }
    }
    if (ptr.drag) { Scene.dragTo(x, y); return; }
    const dx = x - ptr.lx, dy = y - ptr.ly;
    if (dx * dx + dy * dy > 400) { Wind.poke(x, y, dx, dy, 0.9); ptr.lx = x; ptr.ly = y; }
  });
  function end(e, cancel) {
    if (!ptr || e.pointerId !== ptr.id) return;
    const [x, y] = pt(e);
    if (ptr.drag) Scene.release();
    else if (!cancel) {
      if (ptr.onLamb) { if (performance.now() - ptr.t0 < 600) { Scene.hop(); WindAudio.baa(t); } }
      else Scene.walkTo(x, y);
    }
    ptr = null;
  }
  cv.addEventListener('pointerup', e => end(e, false));
  cv.addEventListener('pointercancel', e => end(e, true));
  cv.addEventListener('lostpointercapture', e => { if (ptr && e.pointerId === ptr.id) { if (ptr.drag) Scene.release(); ptr = null; } });

  // adaptive quality: every ~1.5s, nudge the drawn blade fraction toward ~55fps
  let acc = 0, frames = 0;
  function adapt(dt) {
    acc += dt; frames++;
    if (acc < 1.5) return;
    const fps = frames / acc, S = Scene.state; acc = 0; frames = 0;
    if (fps < 50) S.quality = Math.max(window.__grassMode === 'webgl2' ? 0.4 : 0.6, S.quality * 0.9);
    else if (fps > 58) S.quality = Math.min(1, S.quality + 0.05);
    window.__fps = fps;
  }
  let prev = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now; t += dt;
    Wind.update(dt);
    const lvl = Scene.draw(g, dt, t);
    WindAudio.update(Wind.strength * 0.6 + lvl * 0.5 + Wind.gustBoost * 0.5, lvl, t);
    adapt(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
