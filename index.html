<body>
<div class="app">
<header class="topbar"><h1>Wudu Du…</h1><div class="mini-controls" aria-hidden="true">••• │ ⦿</div></header>
<main id="main"></main>
</div>
<aside id="basket" class="floating hidden" aria-label="Selection summary"></aside>
<nav class="bottomnav" aria-label="Main navigation"><button class="nav active" data-page="menu">Menu</button><button class="nav" data-page="cart">Cart <span id="nav-count" class="count hidden"></span></button><button class="nav" data-page="profile">Profile</button></nav>
<dialog id="detail" aria-labelledby="detail-heading"></dialog>
<dialog id="info" aria-labelledby="info-heading"><div class="modal-inner"><div class="modal-top"><h2 id="info-heading"></h2><button class="close" aria-label="Close" onclick="document.querySelector('#info').close()">×</button></div><p id="info-copy" class="subtle"></p></div></dialog>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
// The first six dishes are transcribed from the supplied screenshots. Remaining
// dishes complete the pictured 16-item menu and can be edited here.
const dishes=[
['rabbit','Rabbit Leg','Richly braised with a firm, meaty bite',8,'🍗',2,'Bestseller','#fae1e5'],
['leg','Duck Leg','Tender, juicy and easy off the bone',12,'🍖',1,'Recommended','#fbe2b9'],
['wings','Chicken Wing Tips','Spicy, chewy and perfect for snacking',10,'🥡',2,'','#faedb2'],
['konjac','Shredded Konjac','Light, springy strands that soak up every flavor',10,'🥢',2,'','#dcefd7'],
['head','Duck Head','Deeply seasoned with our signature braise',8,'🦆',3,'Signature','#ead3e0'],
['neck','Duck Neck','Savory, numbing and spicy in every bite',8,'🥓',3,'Signature','#fbe1e5'],
['feet','Duck Feet','Tender, springy and full of braised flavor',10,'🦆',2,'','#f9e5c7'],
['gizzard','Duck Gizzards','A satisfying bite with a savory finish',12,'🥡',2,'','#e4e8d4'],
['lotus','Lotus Root','Crisp slices in our aromatic braise',8,'🪷',1,'','#eedde6'],
['tofu','Tofu Skin','Silky layers with bold, savory flavor',8,'🥢',1,'','#f5e8bb'],
['potato','Potato Slices','Comforting bites with a gentle kick',8,'🥔',1,'','#f5e5c7'],
['kelp','Kelp Knots','Fresh ocean flavor in every little knot',8,'🌿',1,'','#dcebd5'],
['mushroom','King Oyster Mushrooms','Juicy, earthy and beautifully braised',10,'🍄',1,'','#e8dfd1'],
['peanuts','Braised Peanuts','A little crunch, a lot of flavor',6,'🥜',0,'','#f2dfc5'],
['rice','Steamed Rice','Fluffy rice to pair with your favorite bites',3,'🍚',0,'','#e3ece1'],
['tea','Iced Plum Tea','Sweet, tangy and refreshing',6,'🥤',0,'','#efdae3']
].map(([id,name,desc,price,emoji,heat,tag,color])=>({id,name,desc,price,emoji,heat,tag,color}));
const spiceNames=['Mild','Medium','Hot'];
const storage={get(key,fallback){try{return JSON.parse(localStorage.getItem('wudu-'+key))??fallback}catch{return fallback}},set(key,value){try{localStorage.setItem('wudu-'+key,JSON.stringify(value))}catch{}}};
function validLines(lines){return Array.isArray(lines)?lines.filter(x=>x&&dishes.some(d=>d.id===x.id)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=99&&Number.isInteger(x.spice)&&x.spice>=0&&x.spice<=2).map(x=>({id:x.id,qty:x.qty,spice:x.spice})):[]}
let cart=validLines(storage.get('cart',[])),last=storage.get('last',null),favorites=storage.get('favorites',[]),page='menu',category='all',selected=null,spice=1,quantity=1,mode='collection',toastTimer;
if(!Array.isArray(favorites))favorites=[];
if(last&&(!validLines(last.items).length||!['collection','delivery'].includes(last.mode)))last=null;
const $=s=>document.querySelector(s), money=n=>'¥'+n, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const count=()=>cart.reduce((n,x)=>n+x.qty,0),total=()=>cart.reduce((n,x)=>n+dishes.find(d=>d.id===x.id).price*x.qty,0);
function save(){storage.set('cart',cart)}
function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3000)}
function art(d,extra=''){return `<div class="art ${extra}" style="background:linear-gradient(135deg,${d.color}bb,${d.color})">${d.tag?`<span class="tag">${d.tag}</span>`:''}<span class="emoji" aria-hidden="true">${d.emoji}</span></div>`}
function render(){
document.querySelectorAll('.nav').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
$('#nav-count').textContent=count();$('#nav-count').classList.toggle('hidden',!count());
$('#basket').classList.toggle('hidden',!count()||page!=='menu');
$('#basket').innerHTML=`<div class="bag" aria-hidden="true">🛍️<span class="badge">${count()}</span></div><div class="summary"><p>Selected items</p><strong><small>¥</small>${total()}</strong></div><button class="gold" onclick="navigate('cart')">Checkout ›</button>`;
if(page==='menu')renderMenu();else if(page==='cart')renderCart();else renderProfile();
}
function navigate(next){page=next;render();window.scrollTo({top:0,behavior:'instant'})}
function renderMenu(){const list=dishes.filter(d=>category==='all'||category==='hot'&&d.heat>=2||category==='faves'&&favorites.includes(d.id));
$('#main').innerHTML=`<section class="hero"><div class="brand"><div class="logo">🦆</div><div class="brand-copy"><div class="eyebrow">WUDU DUCK DELI · DAPING</div><h2>Wudu Duck Deli</h2></div><div class="actions"><button class="gold" onclick="share()">Share</button><button class="glass" onclick="showInfo('Contact','Wudu Duck Deli · Daping. Contact and opening-hour details have not been supplied yet.')">Contact</button></div></div><div class="hero-content"><span class="fresh">Freshly Braised Today</span><h1>Craving Something <span>Bold</span> Tonight?</h1><p>Signature Sichuan-style braised bites—spicy, savory and satisfying.</p></div><div class="delivery-banner"><div><small>NATIONWIDE DELIVERY</small><strong>Vacuum-packed for lasting freshness</strong></div><button class="textbutton" onclick="showInfo('Nationwide delivery','Our braised bites are vacuum-packed for lasting freshness. Choose Delivery in Your Selection and enter your area. Delivery availability and pricing need confirmation from the deli.')">Details ›</button></div></section><div class="trust"><span><b>◉</b> Fresh Daily</span><span><b>◇</b> No Additives</span><span><b>✦</b> Signature Flavor</span></div><section class="catalog" aria-label="Order menu"><aside class="categories" aria-label="Dish categories">${[['all','🍽️','All'],['hot','🔥','Hot'],['faves','✨','Faves']].map(([id,icon,label])=>`<button class="category ${category===id?'active':''}" onclick="filter('${id}')" aria-pressed="${category===id}"><span>${icon}</span>${label}</button>`).join('')}</aside><div><div class="menu-heading"><div><h2>${category==='all'?'All Items':category==='hot'?'Hot Bites':'Your Favorites'}</h2><p>${category==='all'?'Explore all 16 items from our full menu':list.length+' items to enjoy'}</p></div><button class="repeat" onclick="repeatOrder()" ${last?'':'disabled'} title="${last?'Restore your last saved order':'Save your first order to enable repeat'}">↻ Repeat last order</button></div><div class="cards">${list.map(d=>`<article class="dish">${art(d)}<div class="dish-copy"><button class="dish-title" onclick="openDetail('${d.id}')">${d.name} <small>${'🌶️'.repeat(d.heat)}</small></button><p>${d.desc}</p><div class="dish-bottom"><span class="price"><small>¥</small>${d.price}</span><button class="add" aria-label="Add ${d.name}" onclick="add('${d.id}',1,1)">+</button></div></div></article>`).join('')||'<p class="subtle">No favorites yet. Open Bite Details and tap the heart to save a favorite.</p>'}</div></div></section>`}
function filter(value){category=value;const y=window.scrollY;render();window.scrollTo(0,y)}
function add(id,level,qty){const existing=cart.find(x=>x.id===id&&x.spice===level);if(existing){existing.qty=Math.min(99,existing.qty+qty)}else cart.push({id,spice:level,qty:Math.min(99,qty)});save();render();toast('Added to your selection')}
function openDetail(id){selected=dishes.find(d=>d.id===id);spice=selected.heat===0?0:Math.min(2,selected.heat-1);quantity=1;drawDetail();$('#detail').showModal()}
function drawDetail(){const d=selected;$('#detail').innerHTML=`<div class="modal-inner"><div class="modal-top"><h2 id="detail-heading">Bite Details</h2><button class="close" aria-label="Close Bite Details" onclick="document.querySelector('#detail').close()">×</button></div>${art(d,'detail-art')}<div class="detail-name"><h2>${d.name}</h2><button class="outline" aria-label="${favorites.includes(d.id)?'Remove from':'Add to'} favorites" aria-pressed="${favorites.includes(d.id)}" onclick="toggleFavorite()">${favorites.includes(d.id)?'♥':'♡'}</button></div><p class="subtle">${d.desc}</p><div class="spice"><label for="spice">Spice level <output id="spice-value">${spiceNames[spice]}</output></label><input id="spice" type="range" min="0" max="2" step="1" value="${spice}" aria-valuetext="${spiceNames[spice]}" oninput="setSpice(this)"><div class="range-labels"><span>Mild</span><span>Medium</span><span>Hot</span></div></div><div class="detail-controls"><div class="stepper"><button aria-label="Decrease quantity" onclick="detailQty(-1)">−</button><strong id="detail-qty">${quantity}</strong><button aria-label="Increase quantity" onclick="detailQty(1)">+</button></div><button id="detail-add" class="gold" onclick="addDetail()">Add · ${money(d.price*quantity)}</button></div></div>`}
function setSpice(input){spice=Number(input.value);$('#spice-value').textContent=spiceNames[spice];input.setAttribute('aria-valuetext',spiceNames[spice])}
function detailQty(delta){quantity=Math.max(1,Math.min(99,quantity+delta));$('#detail-qty').textContent=quantity;$('#detail-add').textContent='Add · '+money(selected.price*quantity)}
function toggleFavorite(){favorites=favorites.includes(selected.id)?favorites.filter(id=>id!==selected.id):[...favorites,selected.id];storage.set('favorites',favorites);drawDetail();render()}
function addDetail(){$('#detail').close();add(selected.id,spice,quantity)}
function changeQty(index,delta){cart[index].qty+=delta;if(cart[index].qty<=0)cart.splice(index,1);else cart[index].qty=Math.min(99,cart[index].qty);save();render()}
function clearSelection(){cart=[];save();render();toast('Selection cleared')}
function renderCart(){
$('#main').innerHTML=`<section class="page"><div class="page-head"><div><h1>Your Selection</h1><p class="subtle">${count()} ${count()===1?'bite':'bites'} selected</p></div><button class="outline" onclick="clearSelection()" ${count()?'':'disabled'}>Clear selection</button></div>${!count()?'<div class="empty"><span class="emoji">🛍️</span><h2>Your selection is empty</h2><p class="subtle">Something bold is waiting for you.</p><button class="gold" onclick="navigate(\'menu\')">Explore the menu</button></div>':`<div>${cart.map((x,i)=>{const d=dishes.find(d=>d.id===x.id);return `<article class="cart-row"><div class="cart-icon" aria-hidden="true">${d.emoji}</div><div class="cart-info"><h3>${d.name}</h3><p>${spiceNames[x.spice]} · ${money(d.price)} each</p><strong style="color:var(--pink)">${money(d.price*x.qty)}</strong></div><div class="stepper"><button aria-label="Remove one ${d.name}, ${spiceNames[x.spice]}" onclick="changeQty(${i},-1)">−</button><strong>${x.qty}</strong><button aria-label="Add one ${d.name}, ${spiceNames[x.spice]}" onclick="changeQty(${i},1)">+</button></div></article>`}).join('')}</div><form id="order-form"><div class="fulfillment"><button type="button" class="${mode==='collection'?'active':''}" aria-pressed="${mode==='collection'}" onclick="setMode('collection')">Collection<small>Pick a time</small></button><button type="button" class="${mode==='delivery'?'active':''}" aria-pressed="${mode==='delivery'}" onclick="setMode('delivery')">Delivery<small>Enter your area</small></button></div><label class="field">${mode==='collection'?'Collection time':'Delivery area'}${mode==='collection'?'<select id="fulfillment" required><option value="">Pick a time</option><option>As soon as possible</option><option>In 30 minutes</option><option>In 1 hour</option></select>':'<input id="fulfillment" placeholder="Enter your area or address" maxlength="250" required>'}</label><label class="field">Order notes <textarea id="notes" rows="2" maxlength="500" placeholder="Anything we should know? (optional)"></textarea></label><div class="total"><span>Total</span><span>${money(total())}</span></div><button class="gold wide" type="submit">Save request</button><p class="subtle" style="font-size:12px;margin-top:12px">Saves on this device. Contact the deli to confirm your request; no payment is taken.</p></form>`}</section>`;
if($('#order-form'))$('#order-form').addEventListener('submit',saveOrder);
}
function setMode(value){const notes=$('#notes')?.value||'';mode=value;renderCart();$('#notes').value=notes}
function saveOrder(event){event.preventDefault();const fulfillment=$('#fulfillment').value.trim();if(!fulfillment){$('#fulfillment').focus();toast('Please enter your delivery area');return}last={items:cart.map(x=>({...x})),mode,fulfillment,notes:$('#notes').value.trim(),total:total(),date:new Date().toISOString()};storage.set('last',last);cart=[];save();navigate('profile');toast('Request saved on this device')}
function repeatOrder(){if(!last)return;cart=validLines(last.items);mode=last.mode;save();navigate('cart');$('#fulfillment').value=last.fulfillment;$('#notes').value=last.notes||'';toast('Last order restored — review your selection')}
function renderProfile(){$('#main').innerHTML=`<section class="page"><h1>Profile</h1><p class="subtle">Your Wudu Duck Deli favorites and orders.</p><div class="order-card"><h2>Last saved request</h2>${last?`<p>${esc(new Date(last.date).toLocaleString())} · ${last.mode==='delivery'?'Delivery':'Collection'}</p><p>${esc(last.fulfillment)}</p>${validLines(last.items).map(x=>`<p>${x.qty} × ${dishes.find(d=>d.id===x.id).name} · ${spiceNames[x.spice]}</p>`).join('')}<h3>${money(last.total)}</h3>${last.notes?`<p>${esc(last.notes)}</p>`:''}<button class="gold wide" style="margin-top:16px" onclick="repeatOrder()">Repeat last order</button>`:'<p>No saved requests yet. Pick your favorite bites to get started.</p><button class="gold" onclick="navigate(\'menu\')">Browse menu</button>'}</div><button class="outline wide" onclick="category='faves';navigate('menu')">♡ View favorites (${favorites.length})</button></section>`}
function showInfo(title,copy){$('#info-heading').textContent=title;$('#info-copy').textContent=copy;$('#info').showModal()}
async function share(){try{if(navigator.share){await navigator.share({title:'Wudu Duck Deli',text:'Craving something bold tonight?',url:location.href})}else if(navigator.clipboard&&location.protocol!=='file:'){await navigator.clipboard.writeText(location.href);toast('Link copied')}else showInfo('Share Wudu Duck Deli','Share this HTML file or its hosted address with a friend.')}catch(e){if(e.name!=='AbortError')toast('Sharing is unavailable in this browser')}}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
render();
</script>
</body>
</html>
